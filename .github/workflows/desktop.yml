name: Ghostboard Desktop CI

on:
  push:
    branches:
      - main
      - staging
      - production
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'
  pull_request:
    branches:
      - main
      - staging
      - production
    paths:
      - 'desktop/**'
      - '.github/workflows/desktop.yml'

jobs:
  validate-desktop:
    name: Desktop Frontend & Rust Verification
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Build Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      - name: Install Desktop Node Modules
        working-directory: desktop
        run: npm ci

      - name: Typecheck Frontend
        working-directory: desktop
        run: npm run typecheck

      - name: Build Frontend Renderer
        working-directory: desktop
        run: npm run build:renderer

      - name: Cargo Check (Dev Profile)
        working-directory: desktop/src-tauri
        run: cargo check

      - name: Cargo Check (Release Profile)
        working-directory: desktop/src-tauri
        run: cargo check --release

      - name: Cargo Test
        working-directory: desktop/src-tauri
        run: cargo test
