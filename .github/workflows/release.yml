name: Release Ghostboard Desktop

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    name: Build & Package (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # macOS: Universal Apple Silicon (arm64) & Intel (x64)
          - os: macos-latest
            platform: mac
            build-cmd: npm run build:mac

          # Windows: x64 NSIS Setup
          - os: windows-latest
            platform: win
            build-cmd: npm run build:win

          # Linux: x64 AppImage & Debian
          - os: ubuntu-22.04
            platform: linux
            build-cmd: npm run build:linux

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: 'desktop/package-lock.json'

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'mac' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.platform == 'win' && 'x86_64-pc-windows-msvc' || 'x86_64-unknown-linux-gnu' }}

      - name: Install Linux Build Toolchain & Dependencies
        if: matrix.platform == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev libasound2-dev

      - name: Install Desktop Node Modules
        working-directory: desktop
        run: npm ci

      # Prepare Signing Keys & Graceful Fallback for Matrix Build
      - name: Configure Tauri Signing Key & Environment
        shell: bash
        working-directory: desktop
        env:
          SIGNING_KEY_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          SIGNING_PASSWORD_SECRET: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          if [ -n "$SIGNING_KEY_SECRET" ]; then
            echo "Production TAURI_SIGNING_PRIVATE_KEY detected in GitHub Secrets."
            echo "TAURI_SIGNING_PRIVATE_KEY=$SIGNING_KEY_SECRET" >> $GITHUB_ENV
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=$SIGNING_PASSWORD_SECRET" >> $GITHUB_ENV
          else
            echo "TAURI_SIGNING_PRIVATE_KEY secret is not configured; generating ephemeral keypair for matrix build fallback..."
            mkdir -p /tmp/tauri-keys
            node ./node_modules/.bin/tauri signer generate --ci -p "" -w /tmp/tauri-keys/ephemeral.key
            echo "TAURI_SIGNING_PRIVATE_KEY=$(cat /tmp/tauri-keys/ephemeral.key)" >> $GITHUB_ENV
            echo "TAURI_SIGNING_PRIVATE_KEY_PASSWORD=" >> $GITHUB_ENV
          fi

      # Prepare Optional Code Signing for macOS (Apple Developer ID & Notarytool)
      - name: Setup macOS Code Signing Identity (Optional)
        if: matrix.platform == 'mac' && env.APPLE_CERTIFICATE != ''
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          echo "Setting up temporary keychain for macOS code signing..."
          KEYCHAIN_PATH=$RUNNER_TEMP/build.keychain
          security create-keychain -p "" $KEYCHAIN_PATH
          security set-keychain-settings -lut 21600 $KEYCHAIN_PATH
          security unlock-keychain -p "" $KEYCHAIN_PATH
          echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security import "$RUNNER_TEMP/certificate.p12" -k $KEYCHAIN_PATH -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" $KEYCHAIN_PATH

      # Prepare Optional Code Signing for Windows (Authenticode)
      - name: Setup Windows Authenticode Certificate (Optional)
        if: matrix.platform == 'win' && env.WINDOWS_CERTIFICATE != ''
        shell: bash
        env:
          WINDOWS_CERTIFICATE: ${{ secrets.WINDOWS_CERTIFICATE }}
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}
        run: |
          echo "Decoding Windows Authenticode certificate..."
          echo "$WINDOWS_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.pfx"

      # Compile, Package & Build Tauri v2 Artifacts (including Updater Bundles)
      - name: Build Tauri v2 Desktop Bundle
        working-directory: desktop
        run: ${{ matrix.build-cmd }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ env.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ env.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # macOS Apple Notarytool
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows Code Signing
          WINDOWS_CERTIFICATE_PATH: ${{ runner.temp }}/cert.pfx
          WINDOWS_CERTIFICATE_PASSWORD: ${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}

      # Compute SHA-256 Checksums for Release & Updater Artifacts
      - name: Generate Checksums & Consolidate Artifacts
        shell: bash
        run: |
          mkdir -p release-artifacts
          find desktop/src-tauri/target -type f \( \
            -name "*.AppImage" -o \
            -name "*.deb" -o \
            -name "*.exe" -o \
            -name "*.msi" -o \
            -name "*.dmg" -o \
            -name "*.tar.gz" -o \
            -name "*.zip" -o \
            -name "*.sig" -o \
            -name "latest.json" \
          \) -exec cp {} release-artifacts/ \;
          cd release-artifacts
          for f in *; do
            if [ -f "$f" ]; then
              sha256sum "$f" >> SHA256SUMS-${{ matrix.platform }}.txt
            fi
          done
          cat SHA256SUMS-${{ matrix.platform }}.txt || true

      - name: Upload Artifacts to Action Run
        uses: actions/upload-artifact@v4
        with:
          name: ghostboard-${{ matrix.platform }}-tauri-bundle
          path: |
            release-artifacts/*.dmg
            release-artifacts/*.exe
            release-artifacts/*.msi
            release-artifacts/*.AppImage
            release-artifacts/*.deb
            release-artifacts/*.tar.gz
            release-artifacts/*.zip
            release-artifacts/*.sig
            release-artifacts/latest.json
            release-artifacts/SHA256SUMS-*.txt
          if-no-files-found: warn
