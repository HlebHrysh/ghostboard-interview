# ==============================================================================
# Ghostboard Electron Builder Production Configuration
# Ensures zero-broken shortcuts, clean taskbar grouping, and uncompromised icons
# ==============================================================================

appId: "ai.ghostboard.desktop"
productName: "Ghostboard"
copyright: "Copyright © 2026 Ghostboard Team"

directories:
  output: "dist"
  buildResources: "build"

files:
  - "**/*"
  - "!src-tauri/**"
  - "!dist/**"

# Windows NSIS Installer Configuration
win:
  target:
    - target: "nsis"
      arch:
        - "x64"
    - target: "portable"
      arch:
        - "x64"
  icon: "build/icon.ico"
  legalTrademarks: "Ghostboard"

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: "always"       # CRITICAL: Automatically pins high-res icon to Desktop
  createStartMenuShortcut: true          # Pinned in Windows Start Menu Programs
  shortcutName: "Ghostboard"
  uninstallDisplayName: "Ghostboard Autonomous AI Copilot"
  deleteAppDataOnUninstall: false
  runAfterFinish: true
  installerIcon: "build/icon.ico"
  uninstallerIcon: "build/icon.ico"

# macOS DMG & Universal Package Configuration
mac:
  target:
    - target: "dmg"
      arch:
        - "universal"
        - "arm64"
        - "x64"
    - target: "zip"
  category: "public.app-category.productivity"
  icon: "build/icon.icns"
  hardenedRuntime: true
  gatekeeperAssess: false
  darkModeSupport: true
  minimumSystemVersion: "10.15.0"

dmg:
  title: "Ghostboard Installer"
  icon: "build/icon.icns"
  contents:
    - x: 130
      y: 220
      type: "file"
    - x: 410
      y: 220
      type: "link"
      path: "/Applications"
  window:
    width: 540
    height: 380

# Linux AppImage & Debian Package Configuration
linux:
  target:
    - target: "AppImage"
    - target: "deb"
  icon: "build/icons"
  category: "Utility"
  synopsis: "AI Real-Time Teleprompter & Live Performance Coach"
  description: "Autonomous AI Interview Copilot with screen-share invisibility and zero-latency audio loopback."
  desktop:
    StartupWMClass: "Ghostboard"         # CRITICAL: Maps Wayland/X11 window grouping to Ghostboard icon
    Terminal: false
    Categories: "Utility;Education;"
    MimeType: "x-scheme-handler/ghostboard;"
