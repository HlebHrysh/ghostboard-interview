[package]
name = "ghostboard-desktop"
version = "1.2.0"
description = "Ghostboard Stealth HUD - Autonomous AI Interview Copilot with Screen Share Invisibility"
authors = ["Ghostboard Team"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = { version = "2", features = ["deep-link"] }
tauri-plugin-deep-link = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tokio-util = "0.7"
tokio-tungstenite = { version = "0.24", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json", "stream", "http2"] }
eventsource-stream = "0.2"
regex = "1"
cpal = "0.15"
ringbuf = "0.4"
rubato = "0.16"
tract-onnx = "0.21"
keyring = { version = "3.2", features = ["sync-secret-service", "apple-native", "windows-native"] }
rand = "0.8"
sha2 = "0.10"
base64 = "0.22"
url = "2.5"
screenshots = "0.8"
image = { version = "0.25", default-features = false, features = ["png"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.52", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "macos")'.dependencies]
cocoa = "0.26"
objc = "0.2"

[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"

[profile.release]
lto = true
strip = true
codegen-units = 1
panic = "abort"

