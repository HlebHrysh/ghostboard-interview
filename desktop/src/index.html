<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ghostboard — AI Interview Copilot</title>
  
  <!-- Content Security Policy: allows local Vite scripts, fonts, WebSockets to Deepgram, and local API fetch -->
  <meta http-equiv="Content-Security-Policy" content="
    default-src 'self' file: data:;
    script-src 'self' 'unsafe-inline' 'unsafe-eval' file:;
    style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
    font-src 'self' data: https://fonts.gstatic.com;
    connect-src 'self' ws://127.0.0.1:* http://127.0.0.1:* http://localhost:* https://*.deepgram.com wss://*.deepgram.com https://ghostboard.ai https://*.ghostboard.ai;
    img-src 'self' data: blob: https:;
    media-src 'self' blob:;
  ">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body class="bg-transparent text-zinc-100 overflow-hidden select-none m-0 p-0 antialiased font-sans">
  <!-- React 19 Application Mount Target -->
  <div id="root"></div>

  <!-- Vite Module Entry -->
  <script type="module" src="./index.tsx"></script>
</body>
</html>
