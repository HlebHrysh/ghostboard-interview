<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ghostboard Ultra-Invisible Ticker</title>
  <link rel="stylesheet" href="ticker.css">
</head>
<body>
  <div id="ticker-ribbon" class="ticker-ribbon drag-region">
    <div class="ticker-left no-drag">
      <span class="live-pill"><span class="live-dot"></span>LIVE</span>
      <span class="status-indicator" id="ticker-status">STEALTH</span>
    </div>

    <div class="marquee-window" id="marquee-window">
      <div class="marquee-content" id="marquee-content">
        <span class="stream-item" id="stream-item">
          <span class="q-text" id="ticker-q">Ghostboard Ultra-Invisible Ticker Ribbon</span>
          <span class="divider">──</span>
          <span class="a-text" id="ticker-a">Listening for speech... Answers stream here seamlessly</span>
        </span>
      </div>
    </div>

    <div class="ticker-controls no-drag">
      <button id="btn-freeze-ticker" class="ctrl-btn" title="Freeze / Lock answer (Space / F8)">❄️</button>
      <button id="btn-expand-ticker" class="ctrl-btn" title="Expand to Full HUD (Ctrl+Alt+M)">⤢</button>
      <button id="btn-close-ticker" class="ctrl-btn close" title="Close">✕</button>
    </div>
  </div>

  <script src="ticker.js"></script>
</body>
</html>
