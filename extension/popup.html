<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ghostboard Universal Coding Copilot</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      width: 330px;
      background: #09090b;
      color: #f4f4f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 16px;
      font-size: 12px;
      line-height: 1.5;
      user-select: none;
    }
    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      padding-bottom: 12px;
      margin-bottom: 14px;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }
    .brand-icon {
      width: 24px;
      height: 24px;
      background: #ffffff;
      color: #09090b;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 900;
      font-size: 13px;
    }
    .brand-title {
      font-weight: 700;
      font-size: 13px;
      letter-spacing: -0.02em;
      color: #ffffff;
    }
    .badge {
      background: rgba(200, 241, 53, 0.12);
      color: #c8f135;
      border: 1px solid rgba(200, 241, 53, 0.25);
      font-size: 9px;
      font-weight: 700;
      padding: 2px 7px;
      border-radius: 9999px;
      font-family: ui-monospace, SFMono-Regular, monospace;
    }
    .status-card {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 10px;
      padding: 8px 12px;
      margin-bottom: 14px;
    }
    .status-left {
      display: flex;
      align-items: center;
      gap: 7px;
    }
    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: #71717a;
    }
    .status-dot.connected {
      background: #10b981;
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.8);
    }
    .status-dot.checking {
      background: #f59e0b;
      animation: pulse 1s infinite alternate;
    }
    .status-label {
      font-size: 11px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      color: #a1a1aa;
    }
    .status-host {
      font-size: 10px;
      color: #d4d4d8;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-weight: 600;
    }
    .field {
      margin-bottom: 12px;
    }
    label {
      display: block;
      color: #a1a1aa;
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 5px;
    }
    input, select {
      width: 100%;
      background: #12131a;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 8px;
      color: #fafafa;
      padding: 8px 10px;
      font-size: 11px;
      outline: none;
      font-family: inherit;
      transition: border-color 0.15s;
    }
    input:focus, select:focus {
      border-color: #ffffff;
    }
    .btn-solve {
      width: 100%;
      background: #ffffff;
      color: #09090b;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      box-shadow: 0 0 20px rgba(255, 255, 255, 0.15);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      margin-top: 6px;
    }
    .btn-solve:hover {
      background: #e4e4e7;
      transform: translateY(-1px);
    }
    .btn-solve:active {
      transform: scale(0.98);
    }
    .btn-solve:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .btn-push {
      width: 100%;
      background: #c8f135;
      color: #09090b;
      font-weight: 700;
      border: none;
      border-radius: 10px;
      padding: 10px;
      cursor: pointer;
      font-size: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      box-shadow: 0 0 20px rgba(200, 241, 53, 0.25);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
      margin-top: 8px;
    }
    .btn-push:hover {
      background: #d9fa55;
      transform: translateY(-1px);
    }
    .btn-push:active {
      transform: scale(0.98);
    }
    .btn-push:disabled {
      opacity: 0.6;
      cursor: not-allowed;
      transform: none;
    }
    .solution-preview {
      margin-top: 14px;
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      padding-top: 10px;
      display: none;
      max-height: 280px;
      overflow-y: auto;
    }
    .section-title {
      font-size: 9px;
      font-weight: 700;
      color: #c8f135;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      margin-bottom: 4px;
      margin-top: 8px;
    }
    .preview-box {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 6px;
      padding: 7px 9px;
      font-size: 11px;
      line-height: 1.4;
      color: #e4e4e7;
    }
    .preview-box.trap {
      border-color: rgba(244, 63, 94, 0.4);
      background: rgba(244, 63, 94, 0.08);
      color: #fca5a5;
    }
    .preview-list {
      padding-left: 16px;
      font-size: 11px;
      color: #d4d4d8;
      line-height: 1.4;
      margin-bottom: 4px;
    }
    .preview-list li {
      margin-bottom: 3px;
    }
    .preview-code {
      background: #000000;
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 6px;
      padding: 8px;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 10px;
      color: #a7f3d0;
      max-height: 140px;
      overflow-y: auto;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .hint-box {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 8px;
      padding: 9px 11px;
      margin-top: 14px;
      font-size: 10px;
      color: #71717a;
      line-height: 1.45;
    }
    .hint-box kbd {
      background: #18181b;
      color: #c8f135;
      padding: 1px 5px;
      border-radius: 4px;
      border: 1px solid rgba(255, 255, 255, 0.12);
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-size: 10px;
      font-weight: 600;
    }
    .status-msg {
      margin-top: 8px;
      font-size: 11px;
      min-height: 16px;
      text-align: center;
      font-family: ui-monospace, SFMono-Regular, monospace;
      font-weight: 500;
    }
    @keyframes pulse {
      0% { opacity: 0.4; }
      100% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-icon">G</div>
      <span class="brand-title">GHOSTBOARD</span>
    </div>
    <span class="badge">COPILOT v2</span>
  </div>

  <div class="status-card">
    <div class="status-left">
      <div class="status-dot checking" id="statusDot"></div>
      <span class="status-label" id="statusLabel">Checking connection...</span>
    </div>
    <span class="status-host" id="statusHost">localhost:3000</span>
  </div>

  <div class="field">
    <label for="outputLang">Мова відповіді (Solution Language)</label>
    <select id="outputLang">
      <option value="auto">Auto (Context Aware)</option>
      <option value="bilingual">Bilingual (EN technical + UA hook)</option>
      <option value="uk">Ukrainian (Українська)</option>
      <option value="en">English (Official terminology)</option>
    </select>
  </div>

  <div class="field">
    <label for="apiUrl">Ghostboard Endpoint (Auto-Fallback)</label>
    <input type="text" id="apiUrl" value="http://localhost:3000" placeholder="http://localhost:3000">
  </div>

  <button class="btn-push" id="btnPushProblem">
    <span>🚀 1-Click Push to Live HUD</span>
  </button>

  <button class="btn-solve" id="btnSolve">
    <span>⚡ Захватити поточну задачу / виділення</span>
  </button>

  <div class="status-msg" id="statusMsg"></div>

  <div id="solutionPreview" class="solution-preview">
    <div class="section-title">HOOK</div>
    <div id="previewHook" class="preview-box"></div>

    <div class="section-title">3 PILLARS</div>
    <ul id="previewPillars" class="preview-list"></ul>

    <div class="section-title">OPTIMAL CODE</div>
    <pre id="previewCode" class="preview-code"></pre>

    <div class="section-title">INTERVIEWER TRAP</div>
    <div id="previewTrap" class="preview-box trap"></div>
  </div>

  <div class="hint-box">
    Хоткей: <kbd>Alt + Shift + G</kbd> на LeetCode, HackerRank, Codeforces, CodeSignal, Codility або при виділенні будь-якого тексту в браузері.
  </div>

  <script src="popup.js"></script>
</body>
</html>
